name: "Release"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: "Tag release"
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(python3 .github/scripts/release.py tag)
          VERSION=""
          SHA=""
          while IFS='=' read -r key value; do
            case "$key" in
              version) VERSION="$value" ;;
              sha) SHA="$value" ;;
            esac
          done <<< "$out"
          if [ -z "$VERSION" ]; then
            echo "No untagged version found"
            exit 0
          fi
          git tag "v$VERSION" "$SHA"
          git push origin "refs/tags/v$VERSION"
      - name: "Ensure GitHub release"
        id: ensure_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(python3 .github/scripts/release.py current)
          VERSION=""
          PREVIOUS=""
          while IFS='=' read -r key value; do
            case "$key" in
              version) VERSION="$value" ;;
              previous) PREVIOUS="$value" ;;
            esac
          done <<< "$out"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          notes_args=(--generate-notes)
          if [ -n "$PREVIOUS" ]; then
            notes_args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" "${notes_args[@]}"
      - name: "Prepare release PR"
        if: ${{ !cancelled() && steps.tag.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          body_file="$RUNNER_TEMP/release-body.md"
          open_prs=$(gh pr list --head release/next --state open --json number --jq 'length')
          if [ "$open_prs" != "0" ]; then
            decision=$(gh pr view release/next --json reviewDecision --jq .reviewDecision)
            if [ "$decision" = "APPROVED" ]; then
              echo "Release PR is approved; leaving it as is. Close the PR and re-run to regenerate."
              exit 0
            fi
          fi
          out=$(python3 .github/scripts/release.py prepare --body-file "$body_file")
          VERSION=""
          THROUGH=""
          while IFS='=' read -r key value; do
            case "$key" in
              version) VERSION="$value" ;;
              through) THROUGH="$value" ;;
            esac
          done <<< "$out"
          if [ -z "$VERSION" ]; then
            if [ "$open_prs" != "0" ]; then
              gh pr close release/next --delete-branch --comment "No unreleased changes."
            fi
            exit 0
          fi
          title="chore: release v$VERSION"
          head_date=$(git log -1 --format=%cI HEAD)
          git switch -C release/next
          git add manifest.json plugins
          GIT_AUTHOR_DATE="$head_date" GIT_COMMITTER_DATE="$head_date" git commit -m "$title" -m "Released-through: $THROUGH"
          sleep 120
          git push --force origin release/next
          if [ "$open_prs" != "0" ]; then
            gh pr edit release/next --title "$title" --body-file "$body_file"
          else
            gh pr create --base main --head release/next --title "$title" --body-file "$body_file"
          fi
